# Nonce de la CSP en las páginas HTML: sustituye el marcador de la plantilla (<meta name="csp-nonce">) por
# $request_id, distinto en cada respuesta, que la CSP de security-headers.conf y admin-headers.conf admite en
# style-src. Lo usan los <style> que Radix y Tiptap insertan al ejecutarse (web/src/lib/csp-nonce.ts).
# sub_filter necesita el cuerpo sin comprimir; solo actúa sobre text/html y una vez (sub_filter_once por defecto).
proxy_set_header Accept-Encoding "";
sub_filter '__CSP_NONCE__' '$request_id';
# Sin validadores: un 304 traería una CSP con un nonce nuevo para el HTML guardado con el anterior, y los
# estilos quedarían bloqueados. La página se descarga entera cada vez (Cache-Control: no-cache de `web`).
proxy_set_header If-None-Match "";
proxy_set_header If-Modified-Since "";
proxy_hide_header ETag;
proxy_hide_header Last-Modified;
