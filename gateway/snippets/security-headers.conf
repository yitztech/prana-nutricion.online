# Cabeceras de seguridad de las páginas. Se incluyen en cada `location` que sirve
# HTML: en nginx un `add_header` dentro de una location anula los heredados.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Todo se sirve desde el propio dominio. Si la app carga recursos de terceros
# (fuentes, mapas, pagos), añadir aquí su origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'$analytics_src; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'$analytics_src; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
