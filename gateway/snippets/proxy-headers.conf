proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Se sobrescribe (no se concatena) para que el cliente no pueda inyectar IPs
# falsas en X-Forwarded-For: la app solo confía en este salto.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# Identificador de la petición: el mismo en el log del gateway y en el del servicio.
# Se sobrescribe siempre: el cliente no puede elegirlo.
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Connection        "";
