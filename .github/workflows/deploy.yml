# Verifica cada cambio y, en main, publica las imágenes en GHCR y despliega en Coolify.
#
#   verificar, escenarios, base de datos y seguridad (PR y main) → publicar (gateway, web y app)
#     → desplegar (webhook de Coolify) → comprobar
#
# `Verificar`, `Escenarios`, `Base de datos` y `Seguridad` son los checks que exige la regla de main
# (AGENTS.md §40):
# - Verificar: tipos, pruebas unitarias, build de la web, auditoría de npm, Dockerfiles, reglas del
#   compose, prueba de humo con las imágenes que se van a publicar y análisis de vulnerabilidades.
# - Escenarios: la API (test:api y test:endpoints) y los escenarios web (tests/e2e) contra esas imágenes.
# - Base de datos: test:db contra PostgreSQL de la misma versión mayor y Squawk sobre las migraciones.
# - Seguridad: test:security, CodeQL y ZAP pasivo.
# El entorno `production` (secretos COOLIFY_WEBHOOK y COOLIFY_TOKEN, variable SITE_URL)
# lo rellena el alta del cliente (infra-ionos-vps, playbook cliente-alta). Mientras no
# exista, se publican las imágenes pero no se despliega.
# En el repo de la plantilla solo se verifica: no se publica nada.
name: Desplegar

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  # Sin paths-ignore: el check es obligatorio y un PR solo de documentación también lo necesita
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un PR nuevo cancela la verificación anterior del mismo PR; en main no se cancela nada
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Imágenes locales de la verificación (no salen del runner)
  IMAGE_PREFIX: local/ci
  IMAGE_TAG: ci
  # Variables obligatorias del compose (`:?`), con valores de prueba que no salen del runner.
  TRUSTED_PROXY_CIDR: 127.0.0.1/32
  POSTGRES_PASSWORD: ci-postgres-solo-pruebas
  APP_DB_PASSWORD: ci-app-solo-pruebas-0001
  SITE_URL: https://prana-nutricion.online
  SMTP_HOST: smtp.ci.invalid
  SMTP_PORT: "1025"
  MAIL_FROM: Praná <contacto@prana-nutricion.online>

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Web (cliente y SSR)
        run: npm run build
      - name: Pruebas unitarias
        run: npm run test:unit
      # Falla con vulnerabilidades altas o críticas en las dependencias, salvo las excepciones
      # documentadas y con fecha de revisión de scripts/check-audit.mjs (SEG-06)
      - name: Auditoría de dependencias
        run: npm run check:audit

      # Acciones de terceros fijadas por commit (la etiqueta se puede mover)
      - name: Dockerfile del gateway
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: gateway/Dockerfile
      - name: Dockerfile de web
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: web/Dockerfile
      - name: Dockerfile de app
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile

      - name: Reglas del compose
        run: .github/scripts/reglas-compose.sh compose.prod.yml

      - uses: docker/setup-buildx-action@v4
      # Única construcción: el resto de jobs carga estas imágenes desde un artefacto.
      - name: Construir gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          load: true
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE_PREFIX }}-gateway:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Construir web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Construir app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-app:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # El compose de producción, tal cual (solo lectura, sin root), con las imágenes recién construidas
      - name: Prueba de humo
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          docker compose -f compose.prod.yml up -d --wait --wait-timeout 180
          gw() { docker compose -f compose.prod.yml exec -T gateway "$@"; }

          [ "$(gw wget -qO- http://127.0.0.1/healthz)" = "ok" ]
          [ "$(gw wget -qO- http://127.0.0.1/api/health | jq -r .status)" = "ok" ] || { echo "::error::/api/health no responde ok"; exit 1; }
          gw wget -qO- http://127.0.0.1/ | grep -q 'id="prana-datos"' || { echo "::error::La portada no está generada"; exit 1; }
          revision=$(gw wget -qO- http://127.0.0.1/version.json | jq -r .revision)
          [ "$revision" = "$EXPECTED_SHA" ] || { echo "::error::/version.json sirve $revision"; exit 1; }

          cabeceras=$(gw wget -qS -O /dev/null http://127.0.0.1/ 2>&1)
          for c in Content-Security-Policy Strict-Transport-Security X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            printf '%s\n' "$cabeceras" | grep -qi "^ *$c:" || { echo "::error::Falta la cabecera $c"; exit 1; }
          done

          # El proceso principal de cada contenedor (PostgreSQL arranca como root y baja a postgres)
          for s in $(docker compose -f compose.prod.yml ps --services --status running); do
            pid=$(docker inspect --format '{{.State.Pid}}' "$(docker compose -f compose.prod.yml ps -q "$s")")
            uid=$(awk '/^Uid:/ {print $2}' "/proc/$pid/status")
            [ "$uid" != "0" ] || { echo "::error::$s corre como root"; exit 1; }
          done
          echo "Humo correcto: $revision"

      - name: Logs de la prueba
        if: always()
        run: docker compose -f compose.prod.yml logs --no-color; docker compose -f compose.prod.yml down -v

      # Falla con vulnerabilidades CRITICAL o HIGH que ya tengan arreglo
      - name: Preparar la evidencia de las imágenes
        env:
          IMAGENES_DIR: ${{ runner.temp }}/imagenes-verificadas
        run: mkdir -p "$IMAGENES_DIR"
      - name: Vulnerabilidades de gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE_PREFIX }}-gateway:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: cyclonedx
          scanners: vuln
          output: ${{ runner.temp }}/imagenes-verificadas/gateway.cdx.json
      - name: Vulnerabilidades de web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE_PREFIX }}-web:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: cyclonedx
          scanners: vuln
          output: ${{ runner.temp }}/imagenes-verificadas/web.cdx.json
      - name: Vulnerabilidades de app
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE_PREFIX }}-app:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: cyclonedx
          scanners: vuln
          output: ${{ runner.temp }}/imagenes-verificadas/app.cdx.json

      - name: Exportar las imágenes verificadas
        env:
          IMAGENES_DIR: ${{ runner.temp }}/imagenes-verificadas
        run: sh .github/scripts/imagenes-ci.sh guardar "$IMAGENES_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: imagenes-verificadas
          path: ${{ runner.temp }}/imagenes-verificadas/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  escenarios:
    name: Escenarios
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium y WebKit pesan: se reutilizan mientras no cambie la versión de Playwright
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: imagenes-verificadas
          path: ${{ runner.temp }}/imagenes-verificadas
      - name: Cargar las imágenes verificadas
        env:
          IMAGENES_DIR: ${{ runner.temp }}/imagenes-verificadas
        run: sh .github/scripts/imagenes-ci.sh cargar "$IMAGENES_DIR"
      - run: docker compose -f compose.prod.yml -f compose.ci.yml --profile pruebas up -d --no-build --wait --wait-timeout 180
      - name: API (flujos)
        run: npm run test:api
      - name: API (endpoints)
        run: npm run test:endpoints
      - run: npm run e2e
        env:
          E2E_REVISION: ${{ github.sha }}
      - run: npm run e2e:summary
        if: always()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: qa-evidence
          path: tests/e2e/results/
      - name: Logs del entorno
        if: failure()
        run: docker compose -f compose.prod.yml -f compose.ci.yml --profile pruebas logs --no-color
      - run: docker compose -f compose.prod.yml -f compose.ci.yml --profile pruebas down -v
        if: always()

  base-de-datos:
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # La misma imagen que producción (compose.prod.yml)
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-solo-pruebas
          POSTGRES_DB: postgres
        ports: ["127.0.0.1:54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migraciones y restricciones (test:db)
        run: npm run test:db
      - name: Squawk
        run: npm run check:migraciones

  seguridad:
    name: Seguridad
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript, actions
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: imagenes-verificadas
          path: ${{ runner.temp }}/imagenes-verificadas
      - name: Cargar las imágenes verificadas
        env:
          IMAGENES_DIR: ${{ runner.temp }}/imagenes-verificadas
        run: sh .github/scripts/imagenes-ci.sh cargar "$IMAGENES_DIR"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker compose -f compose.prod.yml -f compose.ci.yml --profile pruebas up -d --no-build --wait --wait-timeout 180
      - name: API (seguridad)
        run: npm run test:security
      # Falla con las reglas en FAIL; los avisos quedan en el informe (artefacto zap_scan)
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8091
          cmd_options: -I
          allow_issue_writing: false
          fail_action: true
      - run: docker compose -f compose.prod.yml -f compose.ci.yml --profile pruebas down -v
        if: always()

  publicar:
    name: Publicar ${{ matrix.name }}
    needs: [verificar, escenarios, base-de-datos, seguridad]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: gateway
          - name: web
          - name: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: imagenes-verificadas
          path: ${{ runner.temp }}/imagenes-verificadas
      - name: Cargar las imágenes verificadas
        env:
          IMAGENES_DIR: ${{ runner.temp }}/imagenes-verificadas
        run: sh .github/scripts/imagenes-ci.sh cargar "$IMAGENES_DIR"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar sin reconstruir y registrar el digest
        id: publicar
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICIO: ${{ matrix.name }}
        run: |
          imagen="ghcr.io/${REPOSITORY,,}-$SERVICIO"
          origen="$IMAGE_PREFIX-$SERVICIO:$IMAGE_TAG"
          docker image tag "$origen" "$imagen:$GITHUB_SHA"
          docker image push "$imagen:$GITHUB_SHA"
          digest=$(docker image inspect --format '{{json .RepoDigests}}' "$imagen:$GITHUB_SHA" |
            jq -er --arg prefijo "$imagen@" '[.[] | select(startswith($prefijo))] | unique | if length == 1 then .[0] else error("Digest no disponible") end')
          docker image tag "$origen" "$imagen:main"
          docker image push "$imagen:main"
          printf '%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf 'name=%s\ndigest=%s\n' "$imagen" "${digest#*@}" >> "$GITHUB_OUTPUT"
      # Se conserva la evidencia de procedencia y SBOM sin volver a construir la imagen.
      - name: Atestar la procedencia
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.publicar.outputs.name }}
          subject-digest: ${{ steps.publicar.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Atestar el SBOM verificado
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.publicar.outputs.name }}
          subject-digest: ${{ steps.publicar.outputs.digest }}
          sbom-path: ${{ runner.temp }}/imagenes-verificadas/${{ matrix.name }}.cdx.json
          push-to-registry: true
          create-storage-record: false

  desplegar:
    name: Desplegar en Coolify
    needs: publicar
    runs-on: ubuntu-latest
    environment: production
    # Un despliegue nunca cancela otro en curso
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: ¿Coolify está configurado?
        id: coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ] && [ -n "$COOLIFY_TOKEN" ] && [ -n "$SITE_URL" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Imágenes publicadas, pero no se despliega: faltan COOLIFY_WEBHOOK, COOLIFY_TOKEN o SITE_URL en el entorno production (los pone el alta del cliente)."
          fi

      - name: Pedir el despliegue a Coolify
        if: steps.coolify.outputs.listo == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Coolify solo despliega con POST
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            --request POST --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

      # Cada redespliegue corta el sitio 1-2 minutos (Coolify para y arranca los
      # contenedores): se espera a que /version.json sirva el commit nuevo.
      - name: Comprobar que la versión nueva ya sirve
        if: steps.coolify.outputs.listo == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            revision=$(curl --fail --silent --max-time 10 "$SITE_URL/version.json" | jq -r '.revision' || true)
            if [ "$revision" = "$EXPECTED_SHA" ]; then
              echo "Desplegado: $EXPECTED_SHA"
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Coolify no sirvió la revisión esperada en 10 minutos."
              exit 1
            fi
            sleep 10
          done
