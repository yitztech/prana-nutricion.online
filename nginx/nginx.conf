# Configuración principal de nginx, común a `gateway` y `web`.
#
# Los dos corren sin root (usuario nginx, 101) y con el sistema de archivos de solo lectura:
# solo se escribe en /tmp, que el compose monta como tmpfs. Por eso el pid, los temporales y
# la configuración que genera el entrypoint viven ahí.
worker_processes 1;            # cada servicio tiene 0,25 CPU: un proceso basta
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # $log_request_id: en el gateway, el $request_id que genera y pasa a los servicios como
    # X-Request-ID; en web, el que recibe. Cada imagen lo define con un map.
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time $log_request_id';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    # web: configuración fija de la imagen. gateway: la que genera el entrypoint en /tmp/nginx.
    include /etc/nginx/conf.d/*.conf;
    include /tmp/nginx/*.conf;
}
