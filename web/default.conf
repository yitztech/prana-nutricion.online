# Web de Praná. Las cabeceras de seguridad y la analítica las pone el gateway.
#   /srv/site/current  versión publicada (enlace que `app` cambia de una vez)
#   /srv/site/assets   CSS y JS con huella de las versiones que se conservan
#   /srv/uploads       imágenes de las promociones (WebP generadas por `app`)

# En el log, el X-Request-ID que manda el gateway (o uno propio si se llama directamente)
map $http_x_request_id $log_request_id { "" $request_id; default $http_x_request_id; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /srv/site/current;
    # Redirecciones relativas: detrás de Traefik, nginx no sabe que el sitio va por https
    absolute_redirect off;
    # Solo se sirven archivos: nada se ejecuta ni se interpreta
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Páginas: /privacidad sirve privacidad.html y /tratamientos/x/ su index.html. Se revalidan siempre.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    # Datos internos de la publicación: no se publican
    location = /release.json { return 404; }

    # CSS, JS y fuentes con huella en el nombre (Vite): no cambian nunca
    location /assets/ {
        root /srv/site;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /img/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Imágenes subidas: solo las variantes WebP con el nombre que genera el servidor (§29)
    location /uploads/ { return 404; }
    location ~ "^/uploads/(promociones/[0-9a-f-]{36}-[0-9]{3,4}\.webp)$" {
        alias /srv/uploads/$1;
        default_type image/webp;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Editor: una sola página; nunca en caché ni en buscadores
    location = /admin { return 301 /admin/; }
    location /admin/ {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /admin/index.html;
    }
}
