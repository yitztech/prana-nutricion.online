# Web de Prana & Nutrición. Las cabeceras de seguridad y la analítica las pone el gateway.

# En el log, el X-Request-ID que manda el gateway (o uno propio si se llama directamente)
map $http_x_request_id $log_request_id { "" $request_id; default $http_x_request_id; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    # Las redirecciones relativas: detrás de Traefik, nginx no sabe que el sitio va por https
    absolute_redirect off;

    # Healthcheck del servicio (lo usa Docker; el gateway no lo publica)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Páginas sin extensión: /privacidad sirve privacidad.html. El HTML se revalida siempre
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    # CSS y JS con huella en el nombre (web/Dockerfile): no cambian nunca
    location ~* "^/assets/.+\.[0-9a-f]{10}\.(css|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imágenes, fuentes e iconos: un mes
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
