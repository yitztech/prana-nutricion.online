# ─────────────────────────────────────────────────────────────────────────────
#  PRODUCCIÓN en Coolify (aplicación Docker Compose)
#
#  Las imágenes las publica GitHub Actions en GHCR (.github/workflows/deploy.yml):
#  el servidor solo las descarga y arranca, nunca compila. Coolify lee este
#  archivo del repositorio y su Traefik pone el dominio y el certificado.
#
#  Reglas de la plataforma (infra-ionos-vps, clientes/README.md):
#  - Dominio: SOLO al servicio `gateway`, puerto 80.
#  - Sin `ports:`: solo el gateway es alcanzable, y solo desde Traefik.
#  - Todo servicio lleva mem_limit: varios clientes comparten servidor.
#  - Todo lo que termina en `:?` es obligatorio: si falta, el despliegue se detiene.
#  - Sin root y con el sistema de archivos de solo lectura: cada servicio escribe solo en
#    sus volúmenes y en /tmp (tmpfs). Las reglas las comprueba el job `Verificar` del CI.
# ─────────────────────────────────────────────────────────────────────────────

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  gateway:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX, p. ej. ghcr.io/yitztech/acme.com}-gateway:${IMAGE_TAG:-main}
    # Corre como usuario nginx: no necesita ninguna capacidad
    mem_limit: 64m
    cpus: 0.25
    environment:
      # Subred de la red de esta app donde está Traefik (se mide tras el primer arranque)
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:?Define la subred de Traefik}
      # Analítica con Umami (vacío = sin analítica). Las pone el alta del cliente.
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      web: { condition: service_healthy }
      app: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

  # Sitio estático que genera `app` (volumen site, solo lectura), imágenes subidas y el editor.
  web:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-web:${IMAGE_TAG:-main}
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - site:/srv/site:ro
      - uploads:/srv/uploads:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

  # API del editor (/api/), generación del sitio y cola de correos. Entra a PostgreSQL con su
  # propio rol, sin superusuario (AGENTS.md §26).
  app:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-app:${IMAGE_TAG:-main}
    mem_limit: 256m
    cpus: 0.5
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      POSTGRES_HOST: postgres
      POSTGRES_DB: prana
      APP_DB_USER: prana_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD}
      SITE_URL: ${SITE_URL:?Define SITE_URL}
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?Define SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?Define MAIL_FROM}
    volumes:
      - site:/srv/site
      - uploads:/srv/uploads
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # frontend: el gateway y el SMTP de la plataforma; backend: PostgreSQL
    networks: [frontend, backend]

  # Migraciones (§27): crea el rol de la app, aplica las migraciones y carga el contenido inicial.
  # Termina; si falla, `app` no arranca.
  migrate:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-app:${IMAGE_TAG:-main}
    restart: "no"
    command: [node, app/src/migrate.ts]
    mem_limit: 128m
    cpus: 0.25
    environment:
      NODE_OPTIONS: --max-old-space-size=96
      POSTGRES_HOST: postgres
      POSTGRES_DB: prana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      APP_DB_USER: prana_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    # Proceso de una sola ejecución: el healthcheck solo comprueba que Node responde
    healthcheck:
      test: [CMD, node, -e, "0"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]

  # Base de datos. La contraseña del superusuario y la del rol de la app las genera el alta:
  #   cliente_web_env_secretos: { POSTGRES_PASSWORD: db, APP_DB_PASSWORD: db }
  # El backup de la plataforma vuelca cada contenedor PostgreSQL en marcha.
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine3.24
    # El entrypoint arranca como root, ajusta el dueño del directorio de datos (CHOWN), lo
    # recorre ya siendo de postgres en cada rearranque (DAC_READ_SEARCH) y baja a ese usuario
    # (SETGID, SETUID). El socket y los temporales van en tmpfs.
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETUID]
    tmpfs: [/tmp, /var/run/postgresql]
    mem_limit: 256m
    cpus: 0.5
    environment:
      POSTGRES_DB: prana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql   # PostgreSQL 18: se monta en /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prana"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

volumes:
  postgres-data:
  # HTML generado por `app` (lo sirve `web`). Se regenera solo: no hace falta en el backup.
  site:
  # Imágenes subidas desde el editor. El backup de la plataforma copia *_uploads.
  uploads:

networks:
  frontend:
  backend:
    internal: true    # sin salida a internet: solo app y migrate ↔ postgres
